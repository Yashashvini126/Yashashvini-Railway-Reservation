<body>

    <h1>DELETE STUDENT</h1>

    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="list.html">List Students</a>
        <a href="listOne.html">List Required Student</a>
        <a href="insert.html">Insert Student</a>
        <a href="update.html">Update Student</a>
        <a href="delete.html">Delete Student</a>
    </div>

    <div class="container">

        <h2>Delete Student Record</h2>

        <label for="sno">Student Number to Delete</label>

        <div class="student-number-box">
            <input type="text" id="sno"
                   placeholder="Enter student number"
                   autocomplete="off">

            <span class="dropdown-arrow"
                  onclick="toggleStudentList(event)">▼</span>

            <div id="studentList" class="student-list"></div>
        </div>

        <br>

        <button class="delete-btn" onclick="deleteStudent()">
            Delete Student
        </button>

        <br><br>

        <button class="home-btn"
                onclick="location.href='index.html'">
            Home Page
        </button>

    </div>

    <script>
        let studentNumbers = [];
        let listLoaded = false;

        async function loadStudentNumbers() {
            try {
                let response = await fetch("/students");

                if (!response.ok) {
                    return;
                }

                let students = await response.json();

                studentNumbers = students.map(student =>
                    String(student.student_id)
                );

                listLoaded = true;

            } catch (error) {
                console.log("Unable to load student numbers.");
            }
        }

        loadStudentNumbers();

        async function toggleStudentList(event) {
            event.stopPropagation();

            let list = document.getElementById("studentList");

            if (list.style.display === "block") {
                list.style.display = "none";
                return;
            }

            if (!listLoaded) {
                await loadStudentNumbers();
            }

            list.innerHTML = "";

            if (studentNumbers.length === 0) {
                let item = document.createElement("div");
                item.textContent = "No student numbers found";
                list.appendChild(item);
            } else {
                studentNumbers.forEach(number => {
                    let item = document.createElement("div");
                    item.textContent = number;

                    item.onclick = function () {
                        document.getElementById("sno").value = number;
                        list.style.display = "none";
                    };

                    list.appendChild(item);
                });
            }

            list.style.display = "block";
        }

        document.addEventListener("click", function (event) {
            let box = document.querySelector(".student-number-box");

            if (!box.contains(event.target)) {
                document.getElementById("studentList").style.display = "none";
            }
        });

        function deleteStudent() {
            let sno = document.getElementById("sno").value.trim();

            if (sno === "" || Number(sno) <= 0) {
                alert("Please enter a valid student number.");
                return;
            }

            if (confirm("Are you sure you want to delete this student?") == false)
                return;

            fetch("/students/" + encodeURIComponent(sno), {
                method: "DELETE"
            })
            .then(response => {
                if (response.ok)
                    return response.text();

                return response.text().then(message => {
                    throw new Error(message);
                });
            })
            .then(message => {
                alert(message);
                location.href = "index.html";
            })
            .catch(error => {
                alert(error.message);
            });
        }
    </script>
