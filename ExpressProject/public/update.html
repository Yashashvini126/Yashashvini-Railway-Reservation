<body>

<h1>UPDATE STUDENT</h1>

<nav>
    <a href="index.html">Home</a>
    <a href="list.html">List Students</a>
    <a href="listOne.html">List Required Student</a>
    <a href="insert.html">Insert Student</a>
    <a href="update.html">Update Student</a>
    <a href="delete.html">Delete Student</a>
</nav>

<div class="container">

    <h2>Update Student Details</h2>

    <form id="updateForm" autocomplete="off">

        <label for="sno">Student Number</label>

        <div class="student-number-box">
            <input type="text" id="sno"
                   placeholder="Enter student number"
                   autocomplete="off">

            <button type="button" class="dropdown-btn"
                    id="dropdownBtn"
                    aria-label="Show saved student numbers">
                &#9662;
            </button>

            <div class="student-list" id="studentList"></div>
        </div>

        <label for="name">Student Name</label>
        <input type="text" id="name"
               name="student_name_update"
               placeholder="Enter student name"
               autocomplete="new-password"
               readonly
               onfocus="this.removeAttribute('readonly')">

        <label for="total">Total Marks</label>
        <input type="text" id="total"
               placeholder="Enter total marks"
               inputmode="numeric"
               autocomplete="off">

        <label for="age">Age</label>
        <input type="text" id="age"
               placeholder="Enter age"
               inputmode="numeric"
               autocomplete="off">

        <label for="phonenumber">Phone Number</label>
        <input type="text" id="phonenumber"
               placeholder="Enter phone number"
               autocomplete="off">

        <button type="submit" class="action-btn">
            Update Student
        </button>

        <button type="button" class="home-btn"
                onclick="location.href='index.html'">
            Home Page
        </button>

    </form>
</div>

<script>
const snoInput = document.getElementById("sno");
const studentList = document.getElementById("studentList");
const dropdownBtn = document.getElementById("dropdownBtn");

let savedStudents = [];

// Load saved student records
fetch("/students")
    .then(response => {
        if (!response.ok) {
            throw new Error("Could not load students.");
        }
        return response.json();
    })
    .then(students => {
        savedStudents = students;
    })
    .catch(error => console.log(error));

// Show saved student numbers
function showStudentNumbers() {
    const typedNumber = snoInput.value.trim();

    studentList.innerHTML = "";

    const filteredStudents = savedStudents.filter(student =>
        String(student.student_id).includes(typedNumber)
    );

    if (filteredStudents.length === 0) {
        const emptyMessage = document.createElement("div");
        emptyMessage.textContent = "No saved student numbers";
        studentList.appendChild(emptyMessage);
    } else {
        filteredStudents.forEach(student => {
            const option = document.createElement("div");
            option.textContent = student.student_id;

            option.addEventListener("click", function() {
                snoInput.value = student.student_id;

                document.getElementById("name").value =
                    student.student_name;

                document.getElementById("total").value =
                    student.total;

                document.getElementById("age").value =
                    student.age;

                document.getElementById("phonenumber").value =
                    student.phonenumber;

                studentList.style.display = "none";
            });

            studentList.appendChild(option);
        });
    }

    studentList.style.display = "block";
}

// Dropdown button
dropdownBtn.addEventListener("click", function() {
    if (studentList.style.display === "block") {
        studentList.style.display = "none";
    } else {
        showStudentNumbers();
    }
});

// Filter numbers while typing
snoInput.addEventListener("input", function() {
    if (studentList.style.display === "block") {
        showStudentNumbers();
    }
});

// Close dropdown outside the student number box
document.addEventListener("click", function(event) {
    if (!event.target.closest(".student-number-box")) {
        studentList.style.display = "none";
    }
});

// Load details when student number changes
snoInput.addEventListener("change", function() {
    const student = savedStudents.find(item =>
        String(item.student_id) === snoInput.value.trim()
    );

    if (student) {
        document.getElementById("name").value =
            student.student_name;

        document.getElementById("total").value =
            student.total;

        document.getElementById("age").value =
            student.age;

        document.getElementById("phonenumber").value =
            student.phonenumber;
    }
});

// Update student
document.getElementById("updateForm")
    .addEventListener("submit", function(event) {
        event.preventDefault();
        updateStudent();
    });

function updateStudent() {
    let sno = document.getElementById("sno").value;
    let name = document.getElementById("name").value;
    let total = document.getElementById("total").value;
    let age = document.getElementById("age").value;
    let phonenumber = document.getElementById("phonenumber").value;

    if (!sno || !name.trim() || total === "" ||
        age.trim() === "" || !phonenumber.trim()) {
        alert("Please fill in all student details.");
        return;
    }

    fetch("/students/" + encodeURIComponent(sno), {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: name,
            total: total,
            age: age,
            phonenumber: phonenumber
        })
    })
    .then(response => {
        return response.text().then(message => {
            if (!response.ok) {
                throw new Error(message || "Unable to update student.");
            }
            return message;
        });
    })
    .then(message => {
        alert(message);
        location.href = "index.html";
    })
    .catch(error => {
        alert(error.message);
    });
}
</script>

</body>
</html>
