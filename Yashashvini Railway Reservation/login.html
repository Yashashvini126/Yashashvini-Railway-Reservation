<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Yashashvini Railway</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* ================= LOGIN PAGE ================= */

        .login-page .login-section {
            padding: 50px 20px;
        }

        .login-page .login-container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* ================= LOGIN BOX ================= */

        .login-page .login-box {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.12);
        }

        .login-page .login-heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-page .login-heading .section-label {
            margin-bottom: 8px;
        }

        .login-page .login-heading h2 {
            margin: 0 0 10px;
            color: #0b1f3a;
        }

        .login-page .welcome {
            margin: 0;
            color: #666;
            line-height: 1.6;
        }


        /* ================= FORM ================= */

        .login-page .form-group {
            margin-bottom: 20px;
        }

        .login-page label {
            display: block;
            font-weight: bold;
            color: #163b68;
            margin-bottom: 8px;
        }

        .login-page input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            box-sizing: border-box;
        }

        .login-page input:focus {
            outline: none;
            border-color: #163b68;
        }


        /* ================= BUTTON ================= */

        .login-page .login-btn {
            width: 100%;
            padding: 13px;
            background-color: #163b68;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-page .login-btn:hover {
            background-color: #0b1f3a;
        }


        /* ================= REGISTER ================= */

        .login-page .register-text {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
        }

        .login-page .register-text a {
            color: #163b68;
            font-weight: bold;
            text-decoration: none;
        }

        .login-page .register-text a:hover {
            text-decoration: underline;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 700px) {

            .login-page .login-section {
                padding: 30px 15px;
            }

            .login-page .login-box {
                padding: 28px 22px;
            }

        }

    </style>

</head>


<body class="login-page">


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">

            <span class="logo-icon">🚆</span>

            <div>

                <h2>YASHASHVINI</h2>

                <small>Railway Reservation</small>

            </div>

        </div>


        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="about.html">
                About
            </a>

            <a href="trains.html">
                Trains
            </a>

            <a href="reservation.html">
                Reservation
            </a>

            <a href="stations.html">
                Stations
            </a>

            <a href="services.html">
                Services
            </a>

            <a href="gallery.html">
                Gallery
            </a>

            <a href="login.html" class="active">
                Login
            </a>

        </nav>

    </header>



    <!-- ================= PAGE BANNER ================= -->

    <section class="page-banner">

        <div class="page-banner-content">

            <p>LOGIN PAGE</p>

            <h1>
                YASHASHVINI
            </h1>

            <h2>
                Railway Reservation Information System
            </h2>

        </div>

    </section>



    <!-- ================= LOGIN SECTION ================= -->

    <section class="login-section">

        <div class="login-container">


            <div class="login-box">


                <!-- Login Heading -->

                <div class="login-heading">

                    <p class="section-label">
                        WELCOME BACK
                    </p>

                    <h2>
                        Login
                    </h2>

                    <p class="welcome">
                        Login to your railway reservation account
                    </p>

                </div>



                <!-- Login Form -->

                <form>


                    <!-- Username -->

                    <div class="form-group">

                        <label for="username">
                            Username or Email
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter username or email"
                            required>

                    </div>



                    <!-- Password -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            required>

                    </div>



                    <!-- Login Button -->

                    <button
                        type="submit"
                        class="login-btn">

                        Login

                    </button>


                </form>



                <!-- Register -->

                <p class="register-text">

                    Don't have an account?

                    <a href="register.html">
                        Register Here
                    </a>

                </p>


            </div>

        </div>

    </section>



    <!-- ================= EMPTY FOOTER ================= -->

    <footer>
    </footer>



    <!-- JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>
